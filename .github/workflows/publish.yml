name: Publish

# Publishes to npm via trusted publishing (OIDC) whenever the version in
# package.json changes on main. No npm token is stored in this repository —
# the registry is configured to trust this workflow file by name, so the
# filename must stay in sync with the npm package settings.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare package.json version against the registry
        id: check
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published; skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is not on the registry; publishing."
          fi

  publish:
    name: Build and publish
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds

      # Trusted publishing requires npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native bindings and TypeScript
        run: bun run build

      - name: Test
        run: bun test

      - name: Publish to npm
        run: bun run release
